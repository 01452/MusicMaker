name: Build MusicMaker for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Download static FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted -Force
          $binary = Get-ChildItem -Path ffmpeg-extracted -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw "ffmpeg.exe was not found in the downloaded archive." }
          Copy-Item $binary.FullName vendor\ffmpeg.exe -Force
          $license = Get-ChildItem -Path ffmpeg-extracted -Filter LICENSE.txt -Recurse | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName vendor\FFMPEG-LICENSE.txt -Force }

      - name: Build portable application
        run: .\build.bat

      - name: Smoke test executable
        shell: pwsh
        run: |
          if (-not (Test-Path dist\MusicMaker.exe)) { throw "MusicMaker.exe was not produced." }
          if ((Get-Item dist\MusicMaker.exe).Length -lt 1000000) { throw "The executable is unexpectedly small." }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME } else { "build-$env:GITHUB_RUN_NUMBER" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\MusicMaker.exe release\MusicMaker.exe
          Copy-Item README.md release\README.txt
          if (Test-Path vendor\FFMPEG-LICENSE.txt) { Copy-Item vendor\FFMPEG-LICENSE.txt release\FFMPEG-LICENSE.txt }
          Compress-Archive -Path release\* -DestinationPath "MusicMaker-Windows-x64-$version.zip" -Force

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: MusicMaker-Windows-x64
          path: MusicMaker-Windows-x64-*.zip
          if-no-files-found: error
